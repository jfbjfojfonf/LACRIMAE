name: dev6-F LUT render

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only, no ffmpeg encode
        type: boolean
        default: false
  push:
    branches: [dev6-F]
    paths:
      - ".github/workflows/dev6f_lut_render.yml"
      - "F01_INGEST/**"
      - "F02_RENDER/**"
      - "F05_CAMOUFLAGE/**"
      - "F06_LUTHER/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install modal (import only)
        run: pip install modal
      - name: Unit tests
        run: python3 -m unittest F01_INGEST.tests.test_ingest F02_RENDER.tests.test_lut F02_RENDER.tests.test_modal_app -v

  render:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install modal
        run: pip install modal
      - name: Auth Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "Missing GitHub secrets MODAL_TOKEN_ID / MODAL_TOKEN_SECRET"
            exit 1
          fi
          modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"
      - name: Deploy F02_RENDER
        run: modal deploy F02_RENDER/CODEBASE/modal_app.py
      - name: Run LUT then F05 F06
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            modal run F02_RENDER/CODEBASE/modal_app.py --dry-run
          else
            modal run F02_RENDER/CODEBASE/modal_app.py --no-dry-run
          fi
      - name: Pull F06 livrable
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          mkdir -p F06_LUTHER/OUT
          modal volume get lacrimae-dev6f f06 F06_LUTHER/OUT
          test -n "$(find F06_LUTHER/OUT -name '*.mp4' -print -quit)"
      - name: Upload F06 artifact
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: lac-dev6f-luther
          path: F06_LUTHER/OUT/
          retention-days: 14
