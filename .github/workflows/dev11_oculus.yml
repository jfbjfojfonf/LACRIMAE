name: dev11-oculus

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to run after contract tests"
        required: true
        default: "contracts"
        type: choice
        options:
          - contracts
          - oculus
          - sanguinor
          - calix
          - full
      object_uri:
        description: "Remote URI for campaign clips (never git)"
        required: false
        default: ""

concurrency:
  group: dev11-oculus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: P-CI contract tests (no MP4 decode)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install -r requirements-dev.txt
      - name: Pytest contrats
        run: python -m pytest tests -q --ignore=tests/test_sanguinor_filter.py
      - name: Isolation CUSTOS
        run: |
          python LAC_CUSTOS.py --frigate F01 --mode check-in || true
          python LAC_CUSTOS.py --frigate F02 --mode check-in || true
          python LAC_CUSTOS.py --frigate F03 --mode check-in || true

  modal:
    name: Dispatch Modal (no local decode)
    needs: contracts
    if: github.event.inputs.stage != 'contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      DEV11_STAGE: ${{ github.event.inputs.stage }}
      DEV11_OBJECT_URI: ${{ github.event.inputs.object_uri }}
      DEV11_TIMEOUT_F01_S: 600
      DEV11_TIMEOUT_F02_S: 300
      DEV11_TIMEOUT_F03_S: 900
    steps:
      - uses: actions/checkout@v4
      - name: Guard secrets
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
      - name: Modal skeleton (Groupe 4 non forge)
        run: |
          echo "Groupe 4: pas de modal run tant que modal/app.py est skeleton"
          echo "stage=$DEV11_STAGE uri=$DEV11_OBJECT_URI"
          echo "Timeouts F01=${DEV11_TIMEOUT_F01_S}s F02=${DEV11_TIMEOUT_F02_S}s F03=${DEV11_TIMEOUT_F03_S}s"
          echo "P-CI-1: this job must not ffmpeg/ffprobe campaign MP4."
